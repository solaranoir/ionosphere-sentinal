[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionosphere-sentinel"
version = "0.1.0"
description = "Async health monitor for space-weather data feeds used in HF radio propagation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
